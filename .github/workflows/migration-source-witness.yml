name: Migration source witness

on:
  pull_request:
    paths:
      - "tools/verify_migration_source.py"
      - "tools/verify_migration_provenance.py"
      - "tests/test_migration_source.py"
      - "tests/test_migration_provenance.py"
      - "provenance/factual-space-pr2/**"
      - ".github/workflows/migration-source-witness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-history:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]

    steps:
      - name: Check out Matter Transfer lane
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Check out recorded Factual Space source head
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-factual-space-simulator
          ref: 1fa76ef579272b4bcfcd1d054977b90a3d596e23
          path: source-factual-space
          fetch-depth: 1

      - name: Compile provenance gates
        run: |
          python -m py_compile \
            tools/verify_migration_provenance.py \
            tools/verify_migration_source.py \
            tests/test_migration_provenance.py \
            tests/test_migration_source.py

      - name: Run complete stacked provenance suite
        run: python -m unittest discover -s tests -v

      - name: Verify destination migration contract
        run: python tools/verify_migration_provenance.py --json

      - name: Verify recorded source history
        run: |
          python tools/verify_migration_source.py \
            --source-repo source-factual-space \
            --require-origin \
            --require-head \
            --json
