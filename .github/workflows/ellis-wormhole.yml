name: Ellis wormhole toy-geometry reproduction

on:
  pull_request:
    paths:
      - "experiments/**"
      - "tests/test_ellis_wormhole.py"
      - ".github/workflows/ellis-wormhole.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile standard-library experiment
        run: python -m py_compile experiments/ellis_wormhole.py tests/test_ellis_wormhole.py
      - name: Run adversarial reproduction tests
        run: python -m unittest discover -s tests -v
      - name: Build and independently replay the declared receipt
        run: |
          python experiments/ellis_wormhole.py run \
            --input experiments/fixtures/ellis_zero_mass_v1.json \
            --output "$RUNNER_TEMP/ellis-receipt.json"
          python experiments/ellis_wormhole.py verify \
            --input experiments/fixtures/ellis_zero_mass_v1.json \
            --receipt "$RUNNER_TEMP/ellis-receipt.json"
